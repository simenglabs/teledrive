# ============================================================
# MengDrive — deployment compose (VPS / server)
#
# Pulls the prebuilt image from Docker Hub — no source code
# or Rust toolchain needed on the server.
#
#   cp .env.example .env   # fill values
#   docker compose pull
#   docker compose up -d
#
# All app config comes from .env (env_file below).
# ============================================================

services:
  mengdrive:
    image: simenglabs/teledrive:latest
    container_name: mengdrive
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Bind port on host is configurable; container always listens on 3060
      SERVER_PORT: 3060
      # Local SQLite lives on the persistent volume
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/data/local.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}

    ports:
      - "${MENGDRIVE_PORT:-3060}:3060"

    volumes:
      # Persists SQLite DB + Telegram session (restored from DB on boot)
      - mengdrive_data:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Optional hardening — uncomment to cap resources
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g
    #       cpus: "1.5"

volumes:
  mengdrive_data:
