# ============================================================
# CD — Build & push MengDrive image to Docker Hub
#
# Philosophy (same as local pre-push hook):
#   cargo check → cargo test → cargo build --release (on the runner)
#   → docker image is assembled from the PREBUILT artifact only
#     (no source code, no Rust toolchain inside the image)
#
# Triggers:
#   - push to master          → tags: latest, sha-<short>
#   - push tag v1.2.3         → tags: 1.2.3, 1.2, latest
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub username (simenglabs)
#   DOCKERHUB_TOKEN     — Docker Hub access token (not your password!)
# ============================================================

name: CD — Docker Hub

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  IMAGE_NAME: simenglabs/teledrive

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Typecheck
        run: cargo check --quiet

      - name: Test
        run: cargo test --quiet

      - name: Build release binary (the artifact that enters the image)
        run: cargo build --release

      - name: Verify binary exists
        run: |
          test -f target/release/s3-telegram
          file target/release/s3-telegram

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image (from prebuilt binary)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🐳 Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
